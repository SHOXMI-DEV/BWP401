<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">دليل فعاليات الجامعة</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">الفعاليات</a></li>
            <li class="nav-item"><a class="nav-link" href="event.html">تفاصيل فعالية</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">عن الدليل</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">اتصل بنا</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-7">
          <section class="card shadow-sm p-4">
            <h1 class="h4 mb-3">نموذج التواصل</h1>
            <div id="formAlert" class="alert d-none" role="alert"></div>
            <form id="contactForm" novalidate>
              <div class="mb-3">
                <label for="name" class="form-label">الاسم</label>
                <input type="text" class="form-control" id="name" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">الرسالة</label>
                <textarea class="form-control" id="message" rows="5" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">إرسال</button>
            </form>
          </section>
        </div>

        <div class="col-lg-5">
          <section class="card shadow-sm p-4 h-100">
            <h2 class="h5 mb-3">معلومات تواصل بديلة</h2>
            <p class="mb-2"><strong>البريد:</strong> info@svu-events.com</p>
            <p class="mb-2"><strong>Facebook:</strong> fb.com/svu.events</p>
            <p class="mb-0"><strong>Instagram:</strong> @svu.events</p>
          </section>
        </div>
      </div>
    </div>
  </main>

  <button id="scrollTopBtn" class="btn btn-primary rounded-circle scroll-top-btn" aria-label="Scroll to top">↑</button>

  <footer class="bg-dark text-white py-4">
    <div class="container d-flex justify-content-between flex-wrap gap-2">
      <small>© 2026 دليل فعاليات الجامعة الافتراضية</small>
      <small>info@svu-events.com</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
